<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Service – Upload</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header>
  <h1>📷 OCR Service</h1>
  <p>Extract text from uploaded images</p>
</header>

<div class="card">

  <a href="/" class="mode-link">← Back to Instagram</a>

  <div>
    <label for="title-input">Note title</label>
    <input type="text" id="title-input" placeholder="OCR – today's date (default)" />
  </div>

  <div>
    <label>Images</label>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" multiple capture="environment" />
      <div class="icon">🖼️</div>
      <p><strong>Tap to choose</strong> or drag &amp; drop</p>
      <p>JPEG, PNG, WebP — up to 20 MB each</p>
    </div>
    <div id="preview-grid" style="margin-top:10px;"></div>
  </div>

  <button type="submit" id="submit-btn" disabled>
    Extract Text
  </button>
  <div class="spinner" id="spinner"></div>

</div>

<div id="result">
  <div class="result-card">
    <div class="result-header">
      <h2 id="result-title">Results</h2>
      <div class="result-buttons">
        <button class="ghost-btn" id="copy-btn">Copy</button>
        <button class="ghost-btn" id="save-btn">Download .md</button>
      </div>
    </div>
    <div id="text-output" class="sections"></div>
  </div>
</div>

<script src="/results.js"></script>
<script src="/app.js"></script>
</body>
</html>
